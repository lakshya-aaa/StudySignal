{% extends 'base.html' %}

{% block title %}Page Not Found (404) - ExamPulse India{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.25rem; text-align: center;">
  <div style="max-width: 550px; margin: 0 auto; background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 3rem 2rem; box-shadow: var(--shadow-sm);">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--accent-saffron); line-height: 1; margin-bottom: 1rem;">
      404
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 0.75rem;">
      Page Not Found
    </h1>
    <p style="color: var(--text-muted); font-size: 0.9375rem; margin-bottom: 2rem;">
      The CBSE document, syllabus page, or resource you are looking for may have moved or does not exist.
    </p>

    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
      <a href="/" class="btn-primary" style="width: auto;">Return Home</a>
      <a href="/cbse/syllabus" class="btn-secondary" style="width: auto;">Browse Syllabi</a>
      <a href="/search" class="btn-secondary" style="width: auto;">Search Resources</a>
    </div>
  </div>
</div>
{% endblock %}
