{% if theme == 'math' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Drawing Compass (Left) -->
  <circle cx="28" cy="18" r="3.5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <path d="M26 21 L16 62" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 21 L38 52" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
  <path d="M38 52 L40 62" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M22 42 Q28 46 34 40" stroke="#94A3B8" stroke-width="1.5" fill="none" />
  <!-- Calculator (Right) -->
  <rect x="52" y="24" width="28" height="42" rx="4" fill="#3B82F6" />
  <rect x="56" y="29" width="20" height="9" rx="2" fill="#DBEAFE" />
  <circle cx="60" cy="45" r="2" fill="#FFFFFF" />
  <circle cx="66" cy="45" r="2" fill="#FFFFFF" />
  <circle cx="72" cy="45" r="2" fill="#FFFFFF" />
  <circle cx="60" cy="52" r="2" fill="#FFFFFF" />
  <circle cx="66" cy="52" r="2" fill="#FFFFFF" />
  <circle cx="72" cy="52" r="2" fill="#FFFFFF" />
  <circle cx="60" cy="59" r="2" fill="#FFD166" />
  <circle cx="66" cy="59" r="2" fill="#FFFFFF" />
  <circle cx="72" cy="59" r="2" fill="#93C5FD" />
  <!-- Pi Symbol (Top Right) -->
  <text x="78" y="20" font-family="serif" font-size="16" font-weight="bold" fill="#2424F5">π</text>
  <!-- Triangle Ruler (Bottom) -->
  <path d="M12 68 L48 68 L12 40 Z" fill="#F59E0B" fill-opacity="0.95" stroke="#D97706" stroke-width="1.5" />
  <path d="M17 65 L36 65 L17 50 Z" fill="#FFFFFF" />
</svg>
{% elif theme == 'science' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Atom Orbits (Top Right) -->
  <ellipse cx="62" cy="20" rx="14" ry="5" transform="rotate(-30 62 20)" stroke="#3B82F6" stroke-width="1.5" fill="none" />
  <ellipse cx="62" cy="20" rx="14" ry="5" transform="rotate(30 62 20)" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
  <ellipse cx="62" cy="20" rx="14" ry="5" transform="rotate(90 62 20)" stroke="#06B6D4" stroke-width="1.5" fill="none" />
  <circle cx="62" cy="20" r="2.5" fill="#2563EB" />
  <circle cx="72" cy="15" r="1.5" fill="#8B5CF6" />
  <circle cx="52" cy="25" r="1.5" fill="#06B6D4" />
  <!-- Test Tube / DNA ladder (Right) -->
  <rect x="80" y="26" width="9" height="34" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5" />
  <path d="M80 42 h9 M80 48 h9 M80 54 h9" stroke="#8B5CF6" stroke-width="1.5" />
  <path d="M80 38 h9 v18 a4 4 0 01-9 0 Z" fill="#8B5CF6" fill-opacity="0.6" />
  <!-- Erlenmeyer Flask (Center) -->
  <path d="M44 30 h12 v12 l16 26 a3 3 0 01-2.6 4.5 H30.6 A3 3 0 0128 68 l16-26 V30 z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <path d="M30 63 l7-12 h26 l7 12 a3 3 0 01-2.6 4.5 H32.6 A3 3 0 0130 63 z" fill="#0284C7" fill-opacity="0.85" />
  <circle cx="42" cy="62" r="2.5" fill="#FFFFFF" />
  <circle cx="52" cy="58" r="2" fill="#FFFFFF" />
  <circle cx="48" cy="52" r="1.5" fill="#FFFFFF" />
  <!-- Green Leaf Sprig (Left) -->
  <path d="M22 65 C16 58 14 46 24 44 C26 54 28 62 22 65 Z" fill="#10B981" />
  <path d="M24 60 C18 64 12 66 8 64 C12 56 18 58 24 60 Z" fill="#059669" />
  <path d="M22 65 Q18 52 24 44" stroke="#047857" stroke-width="1" fill="none" />
</svg>
{% elif theme == 'social' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- India Gate / Monument Arch (Background) -->
  <path d="M60 22 h32 v40 h-8 v-22 a8 8 0 00-16 0 v22 h-8 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" />
  <rect x="56" y="18" width="40" height="5" rx="1.5" fill="#F59E0B" />
  <rect x="64" y="14" width="24" height="4" rx="1" fill="#D97706" />
  <line x1="76" y1="14" x2="76" y2="9" stroke="#D97706" stroke-width="1.5" />
  <circle cx="76" cy="8" r="1.5" fill="#D97706" />
  <!-- Globe on Stand (Foreground) -->
  <circle cx="34" cy="38" r="18" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />
  <path d="M26 26 c4 3 6 8 4 12 -2 3 -6 5 -8 6 m14 -3 c3 -1 6 -4 5 -8 3 1 6 3 7 6 m-8 8 c2 4 6 5 8 3" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Globe Stand -->
  <path d="M16 38 a18 18 0 0036 0" stroke="#0F172A" stroke-width="2.5" fill="none" />
  <path d="M34 56 v10" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
  <!-- Stack of Books at Base -->
  <rect x="22" y="66" width="30" height="5" rx="1" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1" />
  <rect x="20" y="71" width="34" height="5" rx="1" fill="#D97706" stroke="#B45309" stroke-width="1" />
</svg>
{% elif theme == 'hindi' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Open Book -->
  <path d="M12 56 c10-5 22-4 32 2 10-6 22-7 32-2 v-34 c-10-5-22-4-32 2 -10-6-22-7-32-2 v34 z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <path d="M12 56 c10-5 22-4 32 2 v-34 c-10-6-22-7-32-2 v34 z" fill="#FEF3C7" />
  <!-- Devanagari "अ" on Left Page -->
  <text x="27" y="44" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">अ</text>
  <!-- Ink Lines on Right Page -->
  <line x1="48" y1="30" x2="70" y2="30" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="36" x2="68" y2="36" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="42" x2="64" y2="42" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Royal Blue Inkpot (Right Foreground) -->
  <rect x="66" y="52" width="18" height="18" rx="4" fill="#2424F5" stroke="#1E40AF" stroke-width="1.5" />
  <rect x="71" y="48" width="8" height="4" rx="1" fill="#93C5FD" stroke="#1E40AF" stroke-width="1" />
  <!-- Feather Quill standing in Inkpot -->
  <path d="M75 52 C78 38 86 22 95 12 C92 22 88 34 82 42 C78 47 76 50 75 52 Z" fill="#64748B" />
  <path d="M75 52 Q84 32 95 12" stroke="#475569" stroke-width="1.5" />
</svg>
{% elif theme == 'language' %}

  <rect x="18" y="54" width="56" height="12" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5" />

  <rect x="22" y="42" width="52" height="12" rx="2" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5" />
  <rect x="26" y="44" width="46" height="8" fill="#FFFFFF" />
  <line x1="68" y1="44" x2="68" y2="52" stroke="#CBD5E1" stroke-width="1" />

</svg>
{% elif theme == 'computer' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Laptop Screen -->
  <rect x="12" y="18" width="56" height="38" rx="4" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <rect x="15" y="21" width="50" height="32" rx="2" fill="#0F172A" />
  <!-- Code bracket </ > -->
  <text x="40" y="42" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
  <!-- Laptop Base -->
  <path d="M8 56 h64 l-4 8 H12 l-4 -8 z" fill="#64748B" stroke="#475569" stroke-width="1.5" />
  <rect x="36" y="58" width="8" height="2" rx="1" fill="#CBD5E1" />
  <!-- Gear / Cogwheel (Right) -->
  <g transform="translate(76, 44)">
    <circle cx="0" cy="0" r="12" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" />
    <rect x="-2" y="-15" width="4" height="4" fill="#6D28D9" rx="1" />
    <rect x="-2" y="11" width="4" height="4" fill="#6D28D9" rx="1" />
    <rect x="-15" y="-2" width="4" height="4" fill="#6D28D9" rx="1" />
    <rect x="11" y="-2" width="4" height="4" fill="#6D28D9" rx="1" />
    <rect x="-11" y="-11" width="4" height="4" fill="#6D28D9" rx="1" transform="rotate(45)" />
    <rect x="7" y="7" width="4" height="4" fill="#6D28D9" rx="1" transform="rotate(45)" />
    <rect x="-11" y="7" width="4" height="4" fill="#6D28D9" rx="1" transform="rotate(-45)" />
    <rect x="7" y="-11" width="4" height="4" fill="#6D28D9" rx="1" transform="rotate(-45)" />
  </g>
</svg>
{% elif theme == 'commerce' %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Chart Card -->
  <rect x="14" y="16" width="72" height="52" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
  <!-- Bars -->
  <rect x="22" y="44" width="9" height="18" rx="2" fill="#38BDF8" />
  <rect x="36" y="34" width="9" height="28" rx="2" fill="#0284C7" />
  <rect x="50" y="26" width="9" height="36" rx="2" fill="#0369A1" />
  <!-- Trend Line & Arrow -->
  <path d="M24 40 L40 30 L54 22 L70 16" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M64 16 h6 v6" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Coin Badge -->
  <circle cx="70" cy="48" r="10" fill="#FFD166" stroke="#F59E0B" stroke-width="1.5" />
  <text x="70" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">₹</text>
</svg>
{% else %}
<svg viewBox="0 0 100 80" width="88" height="70" fill="none" xmlns="http://www.w3.org/2000/svg" class="syllabus-icon-svg" aria-hidden="true">
  <!-- Graduation Cap -->
  <path d="M50 18 L84 32 L50 46 L16 32 Z" fill="#2424F5" />
  <path d="M32 40 v14 c0 6 8 10 18 10 s18 -4 18 -10 v-14" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1" />
  <path d="M80 34 v18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <circle cx="80" cy="54" r="3" fill="#FFD166" />
  <!-- Book / Scroll underneath -->
  <rect x="25" y="60" width="50" height="8" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
</svg>
{% endif %}
